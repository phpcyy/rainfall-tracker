name: Collect Rainfall Data

on:
  schedule:
    # 北京时间 08:00 (UTC 00:00) 和 20:00 (UTC 12:00) 各执行一次
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, aggregate, and encrypt rainfall data
        env:
          DATA_ENCRYPT_PASSWORD: ${{ secrets.DATA_ENCRYPT_PASSWORD }}
        run: python scripts/fetch_rainfall.py

      - name: Commit encrypted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hourly.enc.json docs/data.enc.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update encrypted rainfall data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')"
            git push
          fi
